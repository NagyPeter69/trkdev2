# Enable TCP PLPMTUD (RFC 4821) - this box's interface is MTU 1500, but
# tracepath shows the real WAN path MTU is 1492 (PPPoE's 8-byte overhead,
# starting right at the first hop past the office gateway). Classic
# ICMP-based Path MTU Discovery depends on "Fragmentation Needed" messages
# making it back to us; if those are dropped anywhere on a real multi-hop
# internet path (common - many firewalls/ISPs block ICMP), this box has no
# fallback and keeps sending full-size segments that silently die at the
# PPPoE hop, relying on retransmission trickle for any forward progress.
# tcp_mtu_probing=1 makes the kernel detect this itself (repeated stalls on
# a connection) and shrink MSS automatically, entirely at the transport
# layer, without needing ICMP at all. Local/LAN traffic (true PMTU 1500)
# is unaffected - probing only engages when a connection is actually
# stalling.
net.ipv4.tcp_mtu_probing = 1
